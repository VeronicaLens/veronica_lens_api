project_id = "veronica_lens_api"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://127.0.0.1:8081"
additional_redirect_urls = ["veronicalens://**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[storage]
enabled = true
file_size_limit = "10MiB"
