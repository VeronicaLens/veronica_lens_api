services:
  - type: web
    name: veronica-lens-api
    runtime: node
    # O plano gratuito suspende por inatividade; jobs precisam de agendamento externo.
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: BACKGROUND_JOBS_ENABLED
        value: 'false'
      - key: CORS_ORIGIN
        value: https://veronicalens.github.io
      - key: PASSWORD_RESET_REDIRECT_URL
        value: veronicalens://auth/reset-password
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
